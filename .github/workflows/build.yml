name: Build NestForge Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Compiler
        run: cargo build --release

      - name: Preparer distribution
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item "target\release\nestforge-engine.exe" "dist\"
          Copy-Item "nestforge.html" "dist\"
          Copy-Item "nestforge.ico" "dist\"

          # Lanceur : ouvre le navigateur APRES que le serveur est pret
          # /b = sans fenetre cmd visible, puis ferme automatiquement
          $bat = "@echo off`r`ncd /d ""%~dp0""`r`nstart /b nestforge-engine.exe`r`ntimeout /t 2 /nobreak >nul`r`nstart """" ""http://localhost:5000"""
          [System.IO.File]::WriteAllText("dist\NestForge.bat", $bat)

          # Script raccourci avec icone
          $lines = @(
            '$exeDir = Split-Path -Parent $MyInvocation.MyCommand.Path',
            '$target  = Join-Path $exeDir "NestForge.bat"',
            '$icon    = Join-Path $exeDir "nestforge.ico"',
            '$desktop = [Environment]::GetFolderPath("Desktop")',
            '$lnkPath = Join-Path $desktop "NestForge.lnk"',
            '$ws = New-Object -ComObject WScript.Shell',
            '$s  = $ws.CreateShortcut($lnkPath)',
            '$s.TargetPath       = $target',
            '$s.WorkingDirectory = $exeDir',
            '$s.IconLocation     = "$icon,0"',
            '$s.Description      = "NestForge - Logiciel de nesting DXF"',
            '$s.WindowStyle      = 7',
            '$s.Save()',
            'if (Test-Path $lnkPath) {',
            '    Write-Host "[OK] Raccourci NestForge cree sur le Bureau !"',
            '} else {',
            '    Write-Host "[ERREUR] Impossible de creer le raccourci."',
            '}',
            'Read-Host "Appuyez sur Entree pour fermer"'
          )
          $lines -join "`r`n" | Out-File -FilePath "dist\create_shortcut.ps1" -Encoding UTF8

          $bat2 = "@echo off`r`npowershell -NoProfile -ExecutionPolicy Bypass -File ""%~dp0create_shortcut.ps1"""
          [System.IO.File]::WriteAllText("dist\Creer_raccourci_bureau.bat", $bat2)

      - name: Zipper
        shell: powershell
        run: Compress-Archive -Path "dist\*" -DestinationPath "NestForge-Windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NestForge-Windows
          path: NestForge-Windows.zip
          retention-days: 30

      - name: Creer Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NestForge v1.0.${{ github.run_number }}
          files: NestForge-Windows.zip
          body: |
            ## NestForge - Logiciel de nesting DXF haute performance

            Installation (une seule fois)
            1. Telechargez NestForge-Windows.zip
            2. Extrayez dans un dossier fixe ex C:\NestForge\
            3. Double-cliquez Creer_raccourci_bureau.bat
            4. Un raccourci NestForge avec icone apparait sur votre Bureau

            Utilisation quotidienne
            Double-cliquez le raccourci NestForge sur le Bureau
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
